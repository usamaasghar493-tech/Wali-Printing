<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wali Printing Admin</title><style>body{font-family:Arial;background:#080808;color:#fff;max-width:700px;margin:auto;padding:30px}.card{background:#151515;padding:25px;border-radius:14px;margin-top:20px}input,button{padding:12px;margin:7px 0;width:100%;box-sizing:border-box}button{cursor:pointer;background:#d6b36a;border:0;font-weight:bold}small{color:#aaa}</style></head><body><h1>Wali Printing</h1><small>Private Recent Work Admin</small><div class="card"><h2>Admin login</h2><p>Enter your admin email to receive a secure login link.</p><input id="email" type="email" value="usamaasghar493@gmail.com"><button id="login">Send login link</button><p id="msg"></p></div><div id="app" class="card" hidden><h2>Upload Recent Work</h2><input id="title" placeholder="Project title"><input id="category" placeholder="Category"><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">Upload & Publish</button><button id="logout">Log out</button><p id="status"></p><div id="list"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S='https://lhhncggahwuqvlctirkk.supabase.co',K='sb_publishable_X_ycbLyow7guRN6IyXZVVw_TZ5sIiOr',E='usamaasghar493@gmail.com',ADMIN_URL='https://waliprinting.com/admin.html',db=supabase.createClient(S,K),$=x=>document.getElementById(x);async function check(){let{data}=await db.auth.getSession();$('app').hidden=!data.session;if(data.session&&data.session.user.email.toLowerCase()!==E){await db.auth.signOut();$('app').hidden=true}if(data.session)load()}check();db.auth.onAuthStateChange(()=>check());$('login').onclick=async()=>{let e=$('email').value.trim().toLowerCase();if(e!==E)return $('msg').textContent='Not authorized.';let{error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:ADMIN_URL,shouldCreateUser:false}});$('msg').textContent=error?error.message:'Check your email for the login link.'};$('logout').onclick=()=>db.auth.signOut();$('upload').onclick=async()=>{let f=$('file').files[0],t=$('title').value.trim(),c=$('category').value.trim();if(!f||!t)return $('status').textContent='Add a title and image.';if(f.size>6291456)return $('status').textContent='Maximum image size is 6 MB.';let p=Date.now()+'-'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');let{error}=await db.storage.from('recent-work').upload(p,f,{contentType:f.type});if(error)return $('status').textContent=error.message;let r=await db.from('recent_work').insert({title:t,category:c,image_path:p});if(r.error){await db.storage.from('recent-work').remove([p]);return $('status').textContent=r.error.message}$('status').textContent='Published successfully.';$('title').value='';$('category').value='';$('file').value='';load()};async function load(){let{data}=await db.from('recent_work').select('*').order('created_at',{ascending:false});$('list').innerHTML=(data||[]).map(x=>'<p><b>'+x.title+'</b> — '+(x.category||'')+'</p>').join('')}</script></body></html>
