<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recent Work | Wali Printing</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1150px,92%);margin:auto;padding:45px 0}.brand{color:#d6b36a;font:700 32px Georgia,serif}.eyebrow{color:#d6b36a;text-transform:uppercase;letter-spacing:3px;font-size:12px;margin-top:50px}h1{font:600 clamp(40px,7vw,72px) Georgia,serif;margin:10px 0}.intro{color:#aaa;max-width:650px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:45px}.card{background:#111;border:1px solid #292929;border-radius:14px;overflow:hidden}.card img{width:100%;height:260px;object-fit:cover;display:block}.info{padding:18px}.info h2{font:600 24px Georgia,serif;margin:0 0 7px}.info p{margin:0;color:#aaa;font-size:14px}.back{display:inline-block;margin-top:35px;color:#d6b36a;text-decoration:none;border:1px solid #d6b36a;padding:11px 18px;border-radius:25px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.card img{height:230px}}</style></head><body><main class="wrap"><div class="brand">Wali Printing</div><div class="eyebrow">Our Portfolio</div><h1>Recent Work</h1><p class="intro">A selection of our latest printing, packaging, cards, stickers and custom design projects.</p><div id="grid" class="grid"><p class="intro">Loading our latest work...</p></div><a class="back" href="/">← Back to Home</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S='https://lhhncggahwuqvlctirkk.supabase.co',K='sb_publishable_X_ycbLyow7guRN6IyXZVVw_TZ5sIiOr',db=supabase.createClient(S,K);async function load(){const{data,error}=await db.from('recent_work').select('*').order('created_at',{ascending:false});const g=document.getElementById('grid');if(error){g.innerHTML='<p class="intro">Unable to load
